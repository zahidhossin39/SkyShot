<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot overlay</title>
    <link rel="stylesheet" href="/src/overlay.css" />
    <script type="module" src="/src/overlay.ts" defer></script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="ui"></canvas>

    <div id="hint" hidden></div>
    <div id="size" hidden></div>

    <div id="toolbar" hidden>
      <div class="group">
        <button data-tool="select" title="Select / move (V)">
          <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" /></svg>
        </button>
        <button data-tool="blur" title="Blur (B)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="2.5 2.5" /><circle cx="12" cy="12" r="3.5" /></svg>
        </button>
        <button data-tool="pixelate" title="Pixelate (P)">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" /><rect x="13" y="13" width="7" height="7" /><rect x="13" y="4" width="7" height="7" class="faint" /><rect x="4" y="13" width="7" height="7" class="faint" /></svg>
        </button>
        <button data-tool="box" title="Solid box (R) — safest for passwords">
          <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" class="fill" /></svg>
        </button>
      </div>
      <div class="group">
        <button data-action="undo" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" /><path d="M4 9h11a5 5 0 010 10h-3" /></svg>
        </button>
        <button data-action="ocr" title="Extract text (T)">
          <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M12 4v16M9 20h6" /></svg>
        </button>
      </div>
      <div class="group finish">
        <button data-action="copy" class="text" title="Copy to clipboard (Ctrl+C)">Copy</button>
        <button data-action="save" class="text" title="Save to your screenshots folder">Save</button>
        <button data-action="both" class="text primary" title="Copy and save">Both</button>
        <button data-action="saveas" title="Save as… (Ctrl+S)">
          <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z" /><path d="M8 4v5h7V4M8 20v-6h8v6" /></svg>
        </button>
      </div>
      <div class="group">
        <button data-action="close" title="Cancel (Esc)">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
    </div>

    <div id="textpanel" hidden>
      <div class="panel-head">
        <span id="text-status">Reading text…</span>
        <button id="text-close" title="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <textarea id="text-out" spellcheck="false"></textarea>
      <div class="panel-foot">
        <button id="text-copy" class="text primary">Copy text</button>
      </div>
    </div>
  </body>
</html>
