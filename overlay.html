<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot overlay</title>
    <link rel="stylesheet" href="/src/overlay.css" />
    <script type="module" src="/src/overlay.ts" defer></script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="ui"></canvas>
    <div id="livetext" hidden></div>
    <textarea id="note-input" rows="1" spellcheck="false" hidden></textarea>

    <div id="hint" hidden></div>
    <div id="loupe" hidden>
      <canvas id="loupe-canvas"></canvas>
      <div id="loupe-info"><span id="loupe-hex"></span><span id="loupe-pos"></span></div>
    </div>
    <div id="size" hidden></div>

    <!-- data-name / data-key / data-desc feed the hover tooltip (see overlay.ts). -->
    <div id="toolbar" hidden>
      <div class="group">
        <button data-tool="select" data-name="Select" data-key="V" data-desc="Move or resize the selection. Click an arrow, box or text to move, recolour or delete it.">
          <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" /></svg>
        </button>
      </div>
      <div class="group" role="group" aria-label="Annotate">
        <button data-tool="arrow" data-name="Arrow" data-key="A" data-desc="Drag to point at something.">
          <svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9" /></svg>
        </button>
        <button data-tool="rect" data-name="Box" data-key="O" data-desc="Drag to draw an outline around something.">
          <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5" /></svg>
        </button>
        <button data-tool="mark" data-name="Highlighter" data-key="H" data-desc="Drag over text to highlight it.">
          <svg viewBox="0 0 24 24"><path d="M14 4l6 6-8 8H6v-6z" /><path d="M4 21h16" class="faint" /></svg>
        </button>
        <button data-tool="text" data-name="Text note" data-key="W" data-desc="Click to type a note on the image. Double-click it later to edit.">
          <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6" /></svg>
        </button>
        <button data-tool="step" data-name="Steps" data-key="N" data-desc="Click to add numbered badges: 1, 2, 3… They renumber if you delete one.">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M11 9.5l1.5-1V16" /></svg>
        </button>
        <button data-action="color" data-name="Colour" data-key="C" data-desc="Change colour for new marks, or for the selected one.">
          <span class="swatch"></span>
        </button>
      </div>
      <div class="group" role="group" aria-label="Redact">
        <button data-tool="blur" data-name="Blur" data-key="B" data-desc="Drag inside the selection to blur. Strong blur can sometimes be undone — use Black box for passwords.">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="2.5 2.5" /><circle cx="12" cy="12" r="3.5" /></svg>
        </button>
        <button data-tool="pixelate" data-name="Pixelate" data-key="P" data-desc="Drag inside the selection to pixelate. Can sometimes be undone — use Black box for passwords.">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" /><rect x="13" y="13" width="7" height="7" /><rect x="13" y="4" width="7" height="7" class="faint" /><rect x="4" y="13" width="7" height="7" class="faint" /></svg>
        </button>
        <button data-tool="box" data-name="Black box" data-key="R" data-desc="Drag to cover with solid black. Safest for passwords and keys.">
          <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" class="fill" /></svg>
        </button>
        <button data-action="smart" data-name="Smart redact" data-key="S" data-desc="Find emails, phone and card numbers, IPs and API keys, then hide the ones you pick. Uses Black box unless Blur or Pixelate is on.">
          <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z" /><path d="M9 12h6" /></svg>
        </button>
      </div>
      <div class="group">
        <button data-action="undo" data-name="Undo" data-key="Ctrl+Z" data-desc="Undo the last mark, move, edit or redaction.">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" /><path d="M4 9h11a5 5 0 010 10h-3" /></svg>
        </button>
        <button data-action="ocr" class="label" data-name="Copy text" data-key="T" data-desc="Read the text in the selection, check it, then copy it.">
          <svg viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 015.5 4H8M16 4h2.5A1.5 1.5 0 0120 5.5V8M20 16v2.5a1.5 1.5 0 01-1.5 1.5H16M8 20H5.5A1.5 1.5 0 014 18.5V16" /><path d="M8 10h8M8 14h5" /></svg>
          Text
        </button>
      </div>
      <div class="group" role="group" aria-label="Finish">
        <button data-action="copy" class="label" data-name="Copy" data-key="Ctrl+C" data-desc="Copy the image to the clipboard.">Copy</button>
        <button data-action="save" class="label" data-name="Save" data-desc="Save a PNG to your screenshots folder.">Save</button>
        <button data-action="both" class="label primary" data-name="Copy & save" data-key="Enter" data-desc="Copy to the clipboard and save a PNG.">Copy &amp; save</button>
        <button data-action="pin" data-name="Pin to screen" data-key="F" data-desc="Float this shot on top of everything as a reference. Drag to move, scroll to zoom, Esc to close.">
          <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3z" /><path d="M12 14v6" /></svg>
        </button>
        <button data-action="saveas" data-name="Save as…" data-key="Ctrl+S" data-desc="Pick a folder and file name.">
          <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z" /><path d="M8 4v5h7V4M8 20v-6h8v6" /></svg>
        </button>
      </div>
      <div class="group">
        <button data-action="close" data-name="Cancel" data-key="Esc" data-desc="Close without saving. Right-click works too.">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
    </div>

    <div id="smartbar" hidden>
      <span id="smart-status"></span>
      <button id="smart-cancel" class="label">Cancel</button>
      <button id="smart-apply" class="label primary">Redact</button>
    </div>

    <div id="tip" role="tooltip" hidden>
      <div class="tip-head"><strong id="tip-name"></strong><kbd id="tip-key"></kbd></div>
      <p id="tip-desc"></p>
    </div>

    <div id="textpanel" hidden>
      <div class="panel-head">
        <span id="text-status">Reading text…</span>
        <button id="text-close" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <textarea id="text-out" spellcheck="false"></textarea>
      <div class="panel-foot">
        <div id="text-actions"></div>
        <button id="text-ai" class="label" title="Send just this area to your AI provider (key in Settings) for a better read of blurry text or handwriting.">
          <svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z" /><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z" /></svg>
          Re-read with AI
        </button>
        <button id="text-copy" class="label primary">Copy all</button>
      </div>
    </div>
  </body>
</html>
