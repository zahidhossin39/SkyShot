name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Each OS has its own native code (OCR, capture, input), so lint and test on all three.
    # ubuntu-22.04: the oldest glibc we ship for.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          sh scripts/get-ocr-models.sh
      - run: npm ci
      # tauri::generate_context! needs the built frontend in dist/.
      - run: npm run build
      - run: npm run check
