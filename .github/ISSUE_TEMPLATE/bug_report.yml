name: Bug report
description: Report a crash, visual glitch, capture/OCR issue, or unexpected behavior in Sky Shot.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below so we can reproduce and fix it quickly.

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which platform are you running Sky Shot on?
      options:
        - Windows 10 / 11
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Sky Shot Version
      description: Check Settings -> About or the app installer version.
      placeholder: "1.0.8"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise summary of what went wrong.
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the issue.
      placeholder: |
        1. Press Ctrl+PrtSc
        2. Select a region on a secondary monitor
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Logs (optional)
      description: >
        You can open the log file (`shutter.log`) from **Settings -> Logs** (Show logs).
        Paste the relevant lines below — please remove any personal paths or sensitive text first.
      render: text
    validations:
      required: false
