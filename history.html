<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shutter — History</title>
    <script>
      // Apply the saved theme before first paint (no flash). Same key as settings.ts / history.ts.
      try {
        var t = localStorage.getItem("shutter-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/history.css" />
    <script type="module" src="/src/history.ts" defer></script>
  </head>
  <body>
    <header>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4 4" /></svg>
        <input id="q" type="search" placeholder="Search text in your screenshots…" autocomplete="off" spellcheck="false" />
      </div>
      <label class="toggle"><input type="checkbox" id="only-starred" /> Starred</label>
      <span id="count"></span>
    </header>
    <main id="grid"></main>
    <p id="empty" hidden></p>
    <div id="viewer" role="dialog" aria-modal="true" aria-label="Screenshot" hidden>
      <img id="viewer-img" alt="" />
      <div class="viewer-bar">
        <button id="viewer-prev" title="Previous (←)" aria-label="Previous">‹</button>
        <span id="viewer-info"></span>
        <button id="viewer-next" title="Next (→)" aria-label="Next">›</button>
        <button id="viewer-copy">Copy</button>
        <button id="viewer-close" title="Close (Esc)" aria-label="Close">✕</button>
      </div>
    </div>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
