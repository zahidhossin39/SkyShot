<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Shot History</title>
    <script>
      // Apply the saved theme before first paint (no flash). Same key as settings.ts / history.ts.
      try {
        var t = localStorage.getItem("shutter-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/history.css" />
    <script type="module" src="/src/history.ts" defer></script>
  </head>
  <body>
    <header>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4 4" /></svg>
        <input id="q" type="search" placeholder="Search text in your screenshots…" aria-label="Search screenshots" autocomplete="off" spellcheck="false" />
      </div>
      <label class="chip-filter"><input type="checkbox" id="only-starred" /> Starred</label>
      <span id="count"></span>
    </header>
    <main id="grid"></main>
    <p id="empty" hidden></p>
    <div id="viewer" role="dialog" aria-modal="true" aria-label="Screenshot" hidden>
      <img id="viewer-img" alt="" />
      <div class="viewer-bar">
        <button id="viewer-prev" class="icon" title="Previous (←)" aria-label="Previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
        </button>
        <span id="viewer-info"></span>
        <button id="viewer-next" class="icon" title="Next (→)" aria-label="Next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
        <button id="viewer-copy" class="filled">Copy</button>
        <button id="viewer-close" class="icon" title="Close (Esc)" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
    </div>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
