[package]
name = "screenshot-app"
version = "0.2.3"
description = "Screenshot tool with blur/redact and OCR"
authors = ["Zaid Hossain"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "screenshot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
xcap = "0.9.8"
arboard = "3.7.0"
chrono = "0.4.45"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-updater = "2"

# Windows built-in OCR (Windows.Media.Ocr). Same version Tauri already pulls in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_System_WinRT",
  # AI re-read: HTTPS via Windows' own client, base64, and the API key in Credential Manager.
  "Web_Http",
  "Web_Http_Headers",
  "Security_Cryptography",
  "Security_Credentials",
  # Scrolling capture: move the cursor and send wheel input.
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # Overlay: turn off the Windows show/hide animation.
  "Win32_Graphics_Dwm",
] }
# Same version Tauri uses; needed to post frames to the overlay via shared memory.
webview2-com = "0.39"

# macOS / Linux: what Windows does with its own APIs (AI re-read HTTPS + key storage).
[target.'cfg(not(windows))'.dependencies]
ureq = "3"
base64 = "0.22"
# Scrolling capture: wheel input + cursor (CGEvent on macOS, XTest on X11).
enigo = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
# OCR: Apple's Vision framework (built in, offline).
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
# Overlay window level / Spaces behaviour.
objc2-app-kit = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# vendored: no libdbus-dev needed to build; crypto-rust: no OpenSSL.
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }
# OCR: pure-Rust engine, no system packages. Its models (~12 MB) ship as bundle resources
# (scripts/get-ocr-models.sh fetches them into ocr-models/; CI runs it).
ocrs = { version = "0.14", default-features = false, features = ["onnx"] }
rten = "0.28"


# Optimize dependencies even in dev builds: screen capture and image conversion are
# ~10x slower unoptimized, which would make hotkey timing in dev meaningless.
[profile.dev.package."*"]
opt-level = 3

# Our own crate too: generic image code (e.g. OCR's 2x resize) is compiled here, and was
# ~20x slower unoptimized.
[profile.dev]
opt-level = 1

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
